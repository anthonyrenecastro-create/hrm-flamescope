    <script>
      // Vite HMR is disabled in cloud container/iFrame environments.
      // Intercept benign dev websocket connection failure rejections to keep the UI error banner clear.
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event &&
          event.reason &&
          typeof event.reason.message === 'string' &&
          (event.reason.message.includes('WebSocket') || event.reason.message.includes('websocket'))
        ) {
          event.preventDefault();
        }
      });
    </script>
